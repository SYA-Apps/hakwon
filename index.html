<!DOCTYPE html>
<html>
<head>
  <!-- `//hakwon/` 처럼 빗금 둘로 들어오면 Flutter 가 history.replaceState 에서 SecurityError 로
       멈춘다(회색 화면). 맨 먼저 한 줄로 바로잡는다 — ADMIN 전달 2026-09-11. -->
  <script>if(location.pathname.indexOf('//')===0)location.replace(location.pathname.replace(/^\/+/,'/')+location.search+location.hash);</script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/hakwon/">

  <meta charset="UTF-8">
  <!-- 로딩 표시가 처음부터 제 크기로 — Flutter 는 이 줄을 엔진이 뜬 뒤에야 넣어서, 그 전엔 아이폰이 980px 로 그려 아이콘이 작게 보였다가 커진다(2026-09-29) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="학원비·결제일·시간표를 한 곳에서. 우리 아이 사교육비 관리 앱.">

<!-- 카톡·메신저 링크 미리보기(Open Graph). 이미지는 절대 주소여야 한다(2026-09-12 추가). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="학원비서">
<meta property="og:title" content="학원비서 · 학원비 관리">
<meta property="og:description" content="학원비·결제일·시간표를 한 곳에서. 우리 아이 사교육비 관리 앱.">
<meta property="og:url" content="https://sya-apps.github.io/hakwon/">
<meta property="og:image" content="https://sya-apps.github.io/hakwon/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="학원비서 — 연필·음표·시계">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="학원비서">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>학원비서 — 학원비 관리</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 첫 화면 로딩 표시 (2026-09-28 ADMIN) — Flutter 웹은 첫 방문에 3MB 안팎을 받는다.
       그동안 흰 화면만 보이면 안 열리는 것으로 읽힌다. 첫 프레임이 그려지면 스스로 사라진다. -->
  <style>
    #sya-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:#fbfaf8;color:#6b665e;
      font:15px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      transition:opacity .25s ease}
    #sya-splash img{width:84px;height:84px;border-radius:21px}
    #sya-splash .bar{width:124px;height:4px;border-radius:99px;background:#e9e5dd;overflow:hidden}
    #sya-splash .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#a89c8a;
      animation:sya-slide 1.1s ease-in-out infinite}
    @keyframes sya-slide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
    @media (prefers-color-scheme: dark){#sya-splash{background:#1b1a18;color:#b9b2a6}
      #sya-splash .bar{background:#302e2a}}
  </style>
  <div id="sya-splash">
    <img src="icons/Icon-192.png" alt="">
    <div>불러오는 중…</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('sya-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- 📦 앱 파일을 폰에 붙들어 두는 캐시(web/sw.js · 2026-09-30 «로딩은 아직도 느려»).
       번호(B)는 배포 때 tool/stamp_web.py 가 main.dart.js 지문으로 바꿔 넣는다.
       🚨 **안 바꿨으면(밑줄로 시작) 캐시를 켜지 않는다** — 번호가 그대로면 새 판을 영영 못 알아채서다.
       그때는 오늘까지와 똑같이(캐시 없이) 돈다. -->
  <script>
    (function () {
      var B = 'd77be23644fd';
      if (!('serviceWorker' in navigator) || B.charAt(0) === '_') return;
      // 새 판이 기다리고 있으면 아래에 띠를 띄운다 — 누르면 새 워커로 넘기고 통째로 다시 연다(판이 섞이지 않게 · ADMIN 10/1)
      var asked = false;
      function offer(w) {
        if (!w || !navigator.serviceWorker.controller || document.getElementById('sya-update')) return;
        var bar = document.createElement('button');
        bar.id = 'sya-update';
        bar.textContent = '새 판이 나왔어요 · 눌러서 바꾸기';
        bar.style.cssText = 'position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));' +
          'z-index:9999;padding:14px;border:0;border-radius:14px;background:#6E8B66;color:#fff;font-size:16px;' +
          'box-shadow:0 4px 16px rgba(0,0,0,.18)';
        bar.onclick = function () { asked = true; bar.textContent = '바꾸는 중…'; w.postMessage({ skip: true }); };
        document.body.appendChild(bar);
      }
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (asked) location.reload(); });
      navigator.serviceWorker.register('sw.js?b=' + B).then(function (reg) {
        if (reg.waiting) offer(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (w) w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
        });
      }).catch(function () {});
      addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          navigator.serviceWorker.ready.then(function (r) {
            var list = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            if (r.active) r.active.postMessage({ warm: list });
          }).catch(function () {});
        }, 2000); // 첫 화면이 뜬 뒤 글꼴·그림까지 다 받은 다음에
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
